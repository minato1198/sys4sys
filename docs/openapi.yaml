openapi: 3.1.0
info:
  title: sys4sys API
  version: 0.1.0
  description: |
    バックエンド運用管理システム（ポート・ログ・監視・AI レポート）の API。

    - 認証はセッション Cookie（`sys4sys_session`）または API トークン（`Authorization: Bearer s4s_...`）。`/health`、`/auth/login`、`/auth/logout` 以外は認証必須。
    - API トークンは `tokens:manage` を除く操作スコープを持つユーザーが作成でき、操作は `config.scopes` と `tokens:manage` で検査する。
    - ロールは `admin` / `operator` / `viewer`。各操作の必要ロールを description に記載。
    - 破壊的操作（kill / restart / 設定変更）は監査ログに記録する。
    - エラーは RFC 7807（application/problem+json）。
servers:
  - url: http://127.0.0.1:8787/api
    description: ローカル開発
tags:
  - name: auth
  - name: users
  - name: hosts
  - name: ports
  - name: services
  - name: logs
  - name: incidents
  - name: approvals
  - name: deploy-requests
  - name: reports
  - name: settings
  - name: audit
security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [auth]
      summary: ヘルスチェック
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptimeSec]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string }
                  uptimeSec: { type: integer }

  /auth/login:
    post:
      tags: [auth]
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: ログイン成功。セッション Cookie を設定
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: 試行回数超過
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/logout:
    post:
      tags: [auth]
      summary: ログアウト
      security: []
      responses:
        "204": { description: ログアウト済み }

  /auth/me:
    get:
      tags: [auth]
      summary: 現在のユーザーと認証種別（認証必須）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMe" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/change-password:
    post:
      tags: [auth]
      summary: パスワード変更
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: 変更済み。現在のセッション以外は無効化される }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tokens:
    get:
      tags: [auth]
      summary: API トークン一覧（認証必須）
      description: |
        自分のトークン一覧は認証のみで取得できる。他ユーザーのトークン一覧には `tokens:manage` が必要。
      parameters:
        - name: userId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TokenView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [auth]
      summary: API トークン発行（session なら認証必須、token なら tokens:manage）
      description: |
        トークン全文は発行時に一度だけレスポンスに含まれる。DB には SHA-256 ハッシュのみ保存し、一覧・詳細では prefix しか返さない。
        トークンでトークンを発行する場合は発行元スコープの部分集合でなければならない。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreateRequest" }
      responses:
        "201":
          description: 発行済み。`token` は一度だけ返る
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [auth]
      summary: API トークン失効（自分または tokens:manage）
      responses:
        "204": { description: 失効済み }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users:
    get:
      tags: [users]
      summary: ユーザー一覧（admin のみ）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      summary: ユーザー作成（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: 作成済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [users]
      summary: ユーザー更新（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: 更新済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hosts:
    get:
      tags: [hosts]
      summary: 実行ホスト一覧（Windows / WSL distro）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Host" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [hosts]
      summary: ホスト登録（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostCreate" }
      responses:
        "201":
          description: 登録済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /hosts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [hosts]
      summary: ホスト詳細（読み取り権限）
      responses:
        "200":
          description: ホスト
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [hosts]
      summary: ホスト更新（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostUpdate" }
      responses:
        "200":
          description: 更新済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hosts/wsl/detect:
    post:
      tags: [hosts]
      summary: WSL ディストロを検出（admin のみ、登録はしない）
      responses:
        "200":
          description: 検出結果
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WslDistro" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /ports:
    get:
      tags: [ports]
      summary: 待受ポート一覧
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [all, windows, wsl], default: all }
          description: all は Windows + WSL をまとめてスキャン
        - name: protocol
          in: query
          schema: { type: string, enum: [tcp, udp] }
        - name: port
          in: query
          schema: { type: integer, minimum: 1, maximum: 65535 }
        - name: serviceId
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: プロセス名・コマンドライン・distro（owners を含む）の部分一致
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, scannedAt]
                properties:
                  scannedAt: { type: string, format: date-time }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Port" }
                  reservations:
                    type: array
                    items: { $ref: "#/components/schemas/Reservation" }
                  conflicts:
                    type: array
                    items: { $ref: "#/components/schemas/Reservation" }
                  skipped:
                    type: array
                    items: { $ref: "#/components/schemas/SkippedDistro" }
                  distros:
                    type: array
                    items: { $ref: "#/components/schemas/WslDistro" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ports/history:
    get:
      tags: [ports]
      summary: ポート利用履歴
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [windows, wsl] }
        - name: port
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 65535 }
        - name: protocol
          in: query
          schema: { type: string, enum: [tcp, udp] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PortHistoryEntry" }

  /ports/reserve:
    post:
      tags: [ports]
      summary: ポート予約（operator 以上）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationCreate" }
      responses:
        "201":
          description: 予約済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "409":
          description: 既に予約済み、または使用中
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /ports/reserve/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [ports]
      summary: 予約解除（operator 以上）
      responses:
        "204": { description: 解除済み }
        "404": { $ref: "#/components/responses/NotFound" }

  /ports/{port}/kill-token:
    parameters:
      - name: port
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 65535 }
    get:
      tags: [ports]
      summary: kill 用の短寿命確認トークンを取得（operator 以上）
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [windows, wsl] }
        - name: pid
          in: query
          schema: { type: integer }
        - name: pidScope
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 確認トークン
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /ports/{port}/kill:
    parameters:
      - name: port
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 65535 }
    post:
      tags: [ports]
      summary: ポートを掴んでいるプロセスを停止（operator 以上）
      description: |
        誤操作防止のため、取得した確認トークンを必須とする。
        トークンは短寿命で、対象 scope / pidScope / port / pid に紐づく。
        監査ログに実行者・対象 PID・シグナルを記録する。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KillRequest" }
      responses:
        "202":
          description: 停止処理を受け付け
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /services:
    get:
      tags: [services]
      summary: サービス一覧
      description: |
        env / deploy.env の値は返しません。キー名は envKeys / deploy.envKeys で返します。
        保存時の暗号文も返しません。
      parameters:
        - name: hostId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [stopped, starting, running, degraded, restarting, failed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
    post:
      tags: [services]
      summary: サービス登録（admin のみ）
      description: |
        env / deploy.env の入力値は受け付けます。作成応答では env / deploy.env の値は *** にマスクします。 env / deploy.env に "***" を含む作成要求は 422 で拒否します。
        保存値はサーバー側で AES-256-GCM で暗号化し、API 応答には平文値も暗号文も返しません。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCreate" }
      responses:
        "201":
          description: 作成済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /services/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [services]
      summary: サービス詳細
      description: |
        env / deploy.env の値は既定で "***" にマスクします。キー名は envKeys / deploy.envKeys で返します。
        平文値が必要な場合は /services/{id}/secrets を使用します。保存時の暗号文は返しません。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [services]
      summary: サービス更新（admin のみ）
      description: |
        env / deploy.env に "***" を含む更新は 422 で拒否します。既存値を変更しない場合は env / deploy.env を省略してください。 deploy オブジェクト更新で deploy.env を省略した場合は既存 deploy.env を保持します。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceUpdate" }
      responses:
        "200":
          description: 更新済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
    delete:
      tags: [services]
      summary: サービス削除（admin のみ）
      description: 履歴保持のため論理削除（is_active=false）。
      responses:
        "204": { description: 削除済み }

  /services/{id}/secrets:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [services]
      summary: サービス env の平文値（admin + services:secrets のみ）
      description: |
        admin 権限と services:secrets スコープが必要です。監査ログに service.secrets.reveal を残します。
        保存値が復号できない場合は 500 を返し、平文値または暗号文を応答に含めません。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSecrets" }
        "403":
          description: admin 権限または services:secrets スコープがありません
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: 保存値の復号に失敗しました
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /services/{id}/start:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [services]
      summary: 起動（operator 以上）
      responses:
        "202":
          description: 起動処理を受け付け
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }
        "409": { $ref: "#/components/responses/Conflict" }

  /services/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [services]
      summary: 停止（operator 以上）
      responses:
        "202":
          description: 停止処理を受け付け
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }

  /services/{id}/restart:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [services]
      summary: 再起動（operator 以上）
      responses:
        "202":
          description: 再起動処理を受け付け
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }

  /services/{id}/deploy:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [services]
      summary: 登録済み deploy 設定でデプロイ（operator 以上）
      description: |
        サービスの `deploy.command` を非同期実行し、`actions.type=deploy` を作成して 202 を返します。
        `deploy.restartAfter=true` の場合は、コマンド成功後に sys4sys がサービスを再起動し、
        `deploy.healthTimeoutSec` の間ヘルスチェックを待ちます。ログは `[deploy]` プレフィックスと
        `fields.source="deploy"` 付きで保存されます。
      responses:
        "202":
          description: デプロイを受け付け
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Action" }
        "409":
          description: 既にデプロイ実行中、または `deploy.requireApproval=true` で即時実行不可
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /services/{id}/deploy-requests:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [deploy-requests]
      summary: デプロイ承認要求を作成（operator 以上）
      description: |
        `deploy.requireApproval=true` のサービスで承認要求を作成する。現在の deploy 設定・env 値を
        保存しないスナップショット（SHA-256 ハッシュ）と一緒に pending 要求を作る。同一サービスに
        pending 要求がある場合は 409 と既存 `deployRequestId` を返す。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: 承認要求を作成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /services/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [services]
      summary: サービスのアクション履歴（services:read）
      description: |
        start / stop / restart / kill / deploy の action を新しい順に返す。cursor は
        `<startedAt>|<id>` 形式。
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionList" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /services/{id}/health:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [services]
      summary: ヘルスチェック結果
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResult" }

  /logs:
    get:
      tags: [logs]
      summary: ログ検索
      parameters:
        - name: hostId
          in: query
          schema: { type: string }
        - name: serviceId
          in: query
          schema: { type: string }
        - name: level
          in: query
          schema: { type: string, enum: [debug, info, warn, error, fatal] }
        - name: q
          in: query
          description: 全文検索
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEventPage" }

  /logs/stream:
    get:
      tags: [logs]
      summary: ログのライブ tail（SSE）
      description: |
        `text/event-stream`。イベント名は `log`、データは LogEvent の JSON。
        接続後の新着ログのみを配信する。15 秒ごとに keep-alive コメントを送る。
      parameters:
        - name: hostId
          in: query
          schema: { type: string }
        - name: serviceId
          in: query
          schema: { type: string }
        - name: level
          in: query
          schema: { type: string }
      responses:
        "200":
          description: SSE ストリーム
          content:
            text/event-stream:
              schema:
                type: string

  /logs/sources:
    get:
      tags: [logs]
      summary: ログソース一覧
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogSource" }
    post:
      tags: [logs]
      summary: ログソース追加（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogSourceCreate" }
      responses:
        "201":
          description: 作成済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSource" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /logs/sources/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [logs]
      summary: ログソース更新（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogSourceUpdate" }
      responses:
        "200":
          description: 更新済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSource" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [logs]
      summary: ログソース削除（admin のみ）
      responses:
        "204": { description: 削除済み }
        "404": { $ref: "#/components/responses/NotFound" }

  /incidents:
    get:
      tags: [incidents]
      summary: インシデント一覧
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acked, approval, resolved]
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, error, critical] }
        - name: serviceId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentList" }

  /incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [incidents]
      summary: インシデント詳細（タイムライン・AI 分析を含む）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /incidents/{id}/ack:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [incidents]
      summary: 確認済みにする（operator / admin）
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentAction" }
      responses:
        "200":
          description: 更新済み（詳細を返す）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /incidents/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [incidents]
      summary: 解決済みにする（operator / admin）
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentAction" }
      responses:
        "200":
          description: 更新済み（詳細を返す）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /incidents/{id}/analyze:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [incidents]
      summary: AI 分析を非同期キューへ投入（operator / admin）
      responses:
        "202":
          description: 分析ジョブを受け付け
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiAnalysisQueued" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /incidents/{id}/analysis:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [incidents]
      summary: 最新の AI 分析とレポート
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [analysis, report]
                properties:
                  analysis:
                    allOf:
                      - $ref: "#/components/schemas/AiAnalysis"
                    nullable: true
                  report:
                    allOf:
                      - $ref: "#/components/schemas/Report"
                    nullable: true
        "404": { $ref: "#/components/responses/NotFound" }

  /approvals:
    get:
      tags: [approvals]
      summary: 承認待ち一覧
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, expired]
            default: pending
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }

  /approvals/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [approvals]
      summary: 再起動を承認（operator / admin）
      description: |
        監視エンジンが作成した `requestedBy=null` の承認は operator / admin どちらも承認できる。
        `requestedBy` が操作ユーザーと一致する自己承認は 403。二重決定は 409。
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "202":
          description: 承認し、再起動アクションを非同期で開始
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDecisionResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /approvals/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [approvals]
      summary: 再起動を却下（operator / admin）
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: 却下済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDecisionResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /deploy-requests:
    get:
      tags: [deploy-requests]
      summary: デプロイ承認要求一覧（読み取り権限）
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, expired, executed, failed]
            default: pending
        - $ref: "#/components/parameters/Limit"
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployRequestList" }

  /deploy-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [deploy-requests]
      summary: デプロイ承認要求詳細（読み取り権限）
      description: |
        pending 要求は期限切れを確認し、期限切れなら status が expired になった状態を返す。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /deploy-requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [deploy-requests]
      summary: デプロイ承認要求を承認して実行（operator 以上）
      description: |
        自己承認は `DEPLOY_ALLOW_SELF_APPROVAL=true` のときだけ許可する。承認時点で現在の deploy
        設定・env スナップショットが要求作成時のものと同じであることを確認する。一致しなければ
        409、期限切れまたは二重決定も 409。承認成功後は action を開始し、status は
        `approved` -> `executed` / `failed` に遷移する。
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployRequestDecision" }
      responses:
        "202":
          description: 承認し、デプロイ action を非同期で開始
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/DeployRequestDecisionResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /deploy-requests/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [deploy-requests]
      summary: デプロイ承認要求を却下（operator 以上）
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployRequestDecision" }
      responses:
        "200":
          description: 却下済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /reports:
    get:
      tags: [reports]
      summary: レポート一覧（新しい順）
      parameters:
        - name: incidentId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }

  /reports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [reports]
      summary: レポート詳細（インシデントと AI 分析を含む）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/{id}/export:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [reports]
      summary: レポートをダウンロード
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [md, json], default: md }
      responses:
        "200":
          description: ファイル（Content-Disposition attachment）
          content:
            text/markdown:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [report, analysis]
                properties:
                  report:
                    allOf:
                      - $ref: "#/components/schemas/Report"
                    nullable: true
                  analysis:
                    allOf:
                      - $ref: "#/components/schemas/AiAnalysis"
                    nullable: true
        "404": { $ref: "#/components/responses/NotFound" }

  /policies:
    get:
      tags: [settings]
      summary: ポリシー一覧
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Policy" }

  /policies/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [settings]
      summary: ポリシー更新（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Policy" }
      responses:
        "200":
          description: 更新済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }

  /settings/mail:
    get:
      tags: [settings]
      summary: メール設定（admin のみ、秘密値はマスク）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSettingsView" }
    put:
      tags: [settings]
      summary: メール設定の更新（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailSettingsInput" }
      responses:
        "200":
          description: 更新済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSettingsView" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/mail/test:
    post:
      tags: [settings]
      summary: 保存済み SMTP 設定でテストメール送信（admin のみ）
      responses:
        "200":
          description: 送信結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailTestResult" }
        "409":
          description: SMTP が未設定
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502":
          description: SMTP 接続または送信に失敗
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /settings/ai:
    get:
      tags: [settings]
      summary: AI 設定（admin のみ、API キーは真偽のみ）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettingsView" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [settings]
      summary: AI 設定の更新（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSettingsInput" }
      responses:
        "200":
          description: 更新済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSettingsView" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /ai/test:
    post:
      tags: [settings]
      summary: 保存済み AI 設定で接続テスト（admin のみ）
      responses:
        "200":
          description: 接続結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiTestResult" }
        "409":
          description: AI が未設定
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502":
          description: AI プロバイダへの接続失敗
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /settings/retention:
    get:
      tags: [settings]
      summary: ログ保持期間（admin のみ）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [settings]
      summary: ログ保持期間の更新（admin のみ）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionSettingsInput" }
      responses:
        "200":
          description: 更新済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettings" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/backup:
    post:
      tags: [settings]
      summary: SQLite オンラインバックアップを作成（admin のみ）
      responses:
        "200":
          description: 作成したバックアップ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: バックアップ作成失敗
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /audit-logs:
    get:
      tags: [audit]
      summary: 監査ログ（admin のみ）
      parameters:
        - name: actor
          in: query
          description: actorLabel の部分一致、または actorUserId の完全一致
          schema: { type: string }
        - name: action
          in: query
          description: action の部分一致
          schema: { type: string }
        - name: target
          in: query
          description: target の部分一致
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogList" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sys4sys_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: "API トークン。`Authorization: Bearer s4s_...` ヘッダーで送る。"

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Cursor:
      name: cursor
      in: query
      description: 前回レスポンスの nextCursor
      schema: { type: string }

  responses:
    Unauthorized:
      description: 未認証
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: 権限不足
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: 見つからない
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: 状態の競合
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: 入力エラー
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        deployRequestId:
          {
            type: string,
            nullable: true,
            description: "approval_required / 既存 pending 要求がある場合に返すデプロイ要求 ID",
          }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 8 }
        newPassword: { type: string, minLength: 12 }

    TokenScope:
      type: string
      enum:
        - services:read
        - services:write
        - services:operate
        - services:secrets
        - deploy:execute
        - logs:read
        - logs:manage
        - incidents:read
        - incidents:write
        - approvals:read
        - approvals:decide
        - hosts:read
        - hosts:write
        - ports:read
        - ports:operate
        - reports:read
        - audit:read
        - settings:read
        - settings:write
        - tokens:manage

    TokenView:
      type: object
      required: [id, name, prefix, scopes, createdAt, expiresAt]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/TokenScope" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }

    TokenCreateRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/TokenScope" }
          minItems: 1
        expiresInDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
        userId: { type: string }

    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/TokenView"
        - type: object
          required: [token]
          properties:
            token:
              {
                type: string,
                description: "発行時に一度だけ返る平文トークン。保存・ログ出力禁止",
              }

    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }

    AuthMe:
      allOf:
        - $ref: "#/components/schemas/AuthUser"
        - type: object
          required: [authMethod, scopes]
          properties:
            authMethod: { type: string, enum: [session, token] }
            scopes:
              type: array
              items: { $ref: "#/components/schemas/TokenScope" }
            token:
              allOf:
                - type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    prefix: { type: string }
                  required: [id, name, prefix]
              nullable: true

    User:
      type: object
      required: [id, email, name, role, isActive]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
        isActive: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [email, name, password, role]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 12 }
        role: { type: string, enum: [admin, operator, viewer] }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        role: { type: string, enum: [admin, operator, viewer] }
        isActive: { type: boolean }
        password: { type: string, minLength: 12 }

    Host:
      type: object
      required: [id, kind, name, enabled, state]
      properties:
        id: { type: string }
        kind: { type: string, enum: [windows, wsl] }
        name: { type: string }
        distro: { type: string, nullable: true }
        defaultUser: { type: string, nullable: true }
        enabled: { type: boolean }
        state: { type: string, enum: [running, stopped, unknown] }
        distroState: { type: string, nullable: true }

    HostCreate:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [windows, wsl] }
        name: { type: string, minLength: 1 }
        distro: { type: string, description: "kind=wsl のとき必須" }
        defaultUser: { type: string }
        enabled: { type: boolean, default: true }

    HostUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        defaultUser: { type: string, nullable: true }
        enabled: { type: boolean }

    WslDistro:
      type: object
      required: [name, state, version, isDefault]
      properties:
        name: { type: string }
        state: { type: string, enum: [Running, Stopped, Installing, Unknown] }
        version: { type: integer }
        isDefault: { type: boolean }
        registered: { type: boolean }

    SkippedDistro:
      type: object
      required: [distro, error]
      properties:
        distro: { type: string }
        error: { type: string }

    Port:
      type: object
      required: [id, scope, protocol, address, port]
      properties:
        id: { type: string }
        scope: { type: string, enum: [windows, wsl] }
        pidScope:
          {
            type: string,
            nullable: true,
            description: WSL で PID を観測した distro,
          }
        seenIn:
          type: array
          items: { type: string }
        protocol: { type: string, enum: [tcp, udp] }
        address: { type: string }
        port: { type: integer }
        pid: { type: integer, nullable: true }
        ppid: { type: integer, nullable: true }
        process: { type: string, nullable: true }
        processPath: { type: string, nullable: true }
        commandLine: { type: string, nullable: true }
        startedAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: プロセス開始時刻,
          }
        serviceId: { type: string, nullable: true }
        likelyWslForward: { type: boolean }
        owners:
          type: array
          items: { $ref: "#/components/schemas/PortOwner" }
        ownerCount: { type: integer }
        firstSeen: { type: string, format: date-time, nullable: true }
        lastSeen: { type: string, format: date-time, nullable: true }
        reservation:
          allOf:
            - $ref: "#/components/schemas/Reservation"
          nullable: true
        conflict:
          {
            type: boolean,
            description: このエンドポイントに予約があり、実リスナーが存在する,
          }
        status: { type: string, enum: [in_use, conflict] }

    PortOwner:
      type: object
      required:
        [
          pid,
          pidScope,
          ppid,
          process,
          processPath,
          commandLine,
          startedAt,
          likelyWslForward,
        ]
      properties:
        pidScope:
          {
            type: string,
            nullable: true,
            description: この PID を観測した distro（WSL の場合）,
          }
        pid: { type: integer, nullable: true }
        ppid: { type: integer, nullable: true }
        process: { type: string, nullable: true }
        processPath: { type: string, nullable: true }
        commandLine: { type: string, nullable: true }
        startedAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: プロセス開始時刻,
          }
        likelyWslForward:
          {
            type: boolean,
            description: このオーナーが WSL フォワード/中継に見えるか,
          }

    PortHistoryEntry:
      type: object
      required: [id, port, scope, openedAt]
      properties:
        id: { type: string }
        port: { type: integer }
        scope: { type: string, enum: [windows, wsl] }
        pidScope: { type: string, nullable: true }
        protocol: { type: string, enum: [tcp, udp] }
        address: { type: string }
        pid: { type: integer, nullable: true }
        ppid: { type: integer, nullable: true }
        process: { type: string, nullable: true }
        processPath: { type: string, nullable: true }
        commandLine: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        serviceId: { type: string, nullable: true }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        releasedBy: { type: string, nullable: true }

    ReservationCreate:
      type: object
      required: [scope, port, protocol, serviceId]
      properties:
        scope: { type: string, enum: [windows, wsl] }
        port: { type: integer, minimum: 1, maximum: 65535 }
        protocol: { type: string, enum: [tcp, udp] }
        serviceId: { type: string }
        note: { type: string }

    Reservation:
      allOf:
        - $ref: "#/components/schemas/ReservationCreate"
        - type: object
          required: [id, createdAt, status, inUse]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            note: { type: string, nullable: true }
            status: { type: string, enum: [reserved, conflict] }
            inUse:
              {
                type: boolean,
                description: 同じ protocol + port に実リスナーが存在する,
              }

    KillToken:
      type: object
      required: [token, expiresAt, scope, pidScope, port, pid, startedAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        scope: { type: string, enum: [windows, wsl] }
        pidScope: { type: string, nullable: true }
        port: { type: integer }
        pid: { type: integer }
        startedAt: { type: string, format: date-time, nullable: true }
        process: { type: string, nullable: true }

    KillRequest:
      type: object
      required: [scope, confirmToken]
      properties:
        scope: { type: string, enum: [windows, wsl] }
        pidScope: { type: string, nullable: true }
        confirmToken:
          {
            type: string,
            description: "POST /ports/{port}/kill の事前取得トークン",
          }
        signal: { type: string, enum: [TERM, KILL], default: TERM }
        force: { type: boolean, default: false }

    Service:
      type: object
      required: [id, hostId, name, status, autoRestartPhase]
      properties:
        id: { type: string }
        hostId: { type: string }
        name: { type: string }
        command:
          type: array
          items: { type: string }
        cwd: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
          description: "一覧では省略。詳細では値は ***。env が null の場合は null。"
        envKeys:
          type: array
          items: { type: string }
          description: "env のキー名"
        expectedPorts:
          type: array
          items: { type: integer }
        healthCheck: { $ref: "#/components/schemas/HealthCheck" }
        deploy:
          allOf:
            - $ref: "#/components/schemas/DeployConfig"
          nullable: true
        dependsOn:
          type: array
          items: { type: string }
        autoStart: { type: boolean }
        autoRestartPhase: { type: string, enum: [observe, approve, auto] }
        status:
          type: string
          enum: [stopped, starting, running, degraded, restarting, failed]
        isActive: { type: boolean }
        pid:
          type: integer
          nullable: true
          description: "Windows の PID。WSL サービスは wsl.exe の PID"
        pidScope:
          type: string
          nullable: true
          description: "ポートスキャンで観測した WSL distro。サービス実行では通常 null"
        lastStartedAt: { type: string, format: date-time, nullable: true }
        lastExitedAt: { type: string, format: date-time, nullable: true }
        lastExitCode: { type: integer, nullable: true }
        lastError: { type: string, nullable: true }
        lastDeployAt: { type: string, format: date-time, nullable: true }
        lastDeployStatus:
          { type: string, enum: [running, succeeded, failed], nullable: true }
        lastDeployError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        host: { $ref: "#/components/schemas/ServiceHost" }
        health:
          allOf:
            - $ref: "#/components/schemas/HealthResult"
          nullable: true
        runtime: { $ref: "#/components/schemas/ServiceRuntime" }

    ServiceHost:
      type: object
      nullable: true
      properties:
        id: { type: string }
        kind: { type: string, enum: [windows, wsl] }
        name: { type: string }
        distro: { type: string, nullable: true }
        defaultUser: { type: string, nullable: true }
        enabled: { type: boolean }

    ServiceRuntime:
      type: object
      properties:
        running: { type: boolean }
        adopted:
          { type: boolean, description: "API 再起動後に引き継いだプロセス" }
        pid: { type: integer, nullable: true }
        pidScope: { type: string, nullable: true }
        health:
          allOf:
            - $ref: "#/components/schemas/HealthResult"
          nullable: true

    ServiceDetail:
      allOf:
        - $ref: "#/components/schemas/Service"
        - type: object
          properties:
            recentActions:
              type: array
              items: { $ref: "#/components/schemas/Action" }

    ServiceSecrets:
      type: object
      properties:
        env:
          type: object
          additionalProperties: { type: string }
          nullable: true
        deployEnv:
          type: object
          additionalProperties: { type: string }
          nullable: true

    ServiceCreate:
      type: object
      required: [hostId, name, command]
      properties:
        hostId: { type: string }
        name: { type: string }
        command:
          type: array
          items: { type: string }
          minItems: 1
        cwd: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        expectedPorts:
          type: array
          items: { type: integer }
        healthCheck: { $ref: "#/components/schemas/HealthCheck" }
        deploy: { $ref: "#/components/schemas/DeployConfig" }
        dependsOn:
          type: array
          items: { type: string }
        autoStart: { type: boolean, default: false }
        autoRestartPhase:
          { type: string, enum: [observe, approve, auto], default: observe }

    ServiceUpdate:
      type: object
      properties:
        name: { type: string }
        command:
          type: array
          items: { type: string }
        cwd: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        expectedPorts:
          type: array
          items: { type: integer }
        healthCheck: { $ref: "#/components/schemas/HealthCheck" }
        deploy:
          allOf:
            - $ref: "#/components/schemas/DeployConfig"
          nullable: true
        dependsOn:
          type: array
          items: { type: string }
        autoStart: { type: boolean }
        autoRestartPhase: { type: string, enum: [observe, approve, auto] }

    DeployConfig:
      type: object
      required: [command]
      properties:
        command:
          type: array
          items: { type: string }
          minItems: 1
          description: "SERVICE_COMMAND_ALLOWLIST に従って実行するコマンド配列"
        cwd:
          type: string
          description: "省略時はサービスの cwd。Windows では存在確認を行う"
        env:
          type: object
          additionalProperties: { type: string }
          description: "サービス env に上書きマージされる環境変数。一覧では省略、詳細では値は ***。"
        envKeys:
          type: array
          items: { type: string }
          description: "deploy.env のキー名"
        timeoutSec: { type: integer, minimum: 10, maximum: 3600, default: 600 }
        restartAfter: { type: boolean, default: true }
        healthTimeoutSec:
          { type: integer, minimum: 5, maximum: 900, default: 120 }
        requireApproval:
          {
            type: boolean,
            default: false,
            description: "true なら即時 deploy は 409 approval_required になり deploy-requests 承認が必要",
          }

    HealthCheck:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [http, tcp, process, command] }
        url: { type: string, description: "type=http" }
        port: { type: integer, description: "type=tcp" }
        command:
          type: array
          items: { type: string }
          description: "type=command"
        intervalSec: { type: integer, default: 10 }
        timeoutSec: { type: integer, default: 3 }
        failures: { type: integer, default: 3 }

    HealthResult:
      type: object
      required: [serviceId, status, checkedAt]
      properties:
        serviceId: { type: string }
        status: { type: string, enum: [healthy, unhealthy, unknown, stopped] }
        latencyMs: { type: integer }
        checkedAt: { type: string, format: date-time }
        detail: { type: string }
        consecutiveFailures: { type: integer }

    LogEvent:
      type: object
      required: [id, ts, level, message]
      properties:
        id: { type: string }
        hostId: { type: string }
        serviceId: { type: string }
        ts: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error, fatal] }
        stream: { type: string, enum: [stdout, stderr, file, eventlog] }
        message: { type: string }
        fields:
          type: object
          additionalProperties: true
        fingerprint: { type: string }

    LogEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LogEvent" }
        nextCursor: { type: string, nullable: true }

    LogSource:
      type: object
      required: [id, hostId, type, enabled]
      properties:
        id: { type: string }
        hostId: { type: string }
        serviceId: { type: string, nullable: true }
        type: { type: string, enum: [file, wsl_file, eventlog] }
        config:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        hostName: { type: string, nullable: true }
        hostKind: { type: string, enum: [windows, wsl], nullable: true }
        serviceName: { type: string, nullable: true }

    LogSourceCreate:
      type: object
      required: [hostId, type, config]
      properties:
        hostId: { type: string }
        serviceId: { type: string, nullable: true }
        type:
          type: string
          enum: [file, wsl_file, eventlog]
          description: "stdout/stderr はサービス起動時に自動収集するため登録不要。eventlog は未実装（422）"
        config:
          type: object
          additionalProperties: true
        enabled: { type: boolean, default: true }

    LogSourceUpdate:
      type: object
      properties:
        serviceId: { type: string, nullable: true }
        config:
          type: object
          additionalProperties: true
        enabled: { type: boolean }

    IncidentService:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        hostId: { type: string }
        status: { type: string }
        autoRestartPhase: { type: string, enum: [observe, approve, auto] }
        lastStartedAt: { type: string, format: date-time, nullable: true }
        lastExitedAt: { type: string, format: date-time, nullable: true }
        lastExitCode: { type: integer, nullable: true }
        lastError: { type: string, nullable: true }

    IncidentHost:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [windows, wsl] }
        name: { type: string }
        distro: { type: string, nullable: true }
        defaultUser: { type: string, nullable: true }
        enabled: { type: boolean }

    Incident:
      type: object
      required: [id, serviceId, title, severity, status, startedAt]
      properties:
        id: { type: string }
        serviceId: { type: string }
        fingerprint: { type: string }
        title: { type: string }
        severity: { type: string, enum: [info, warning, error, critical] }
        status: { type: string, enum: [open, acked, approval, resolved] }
        startedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        detectedBy: { type: string, enum: [rule, health, process, ai] }
        restartAttempts: { type: integer }
        summary: { type: string, nullable: true }
        pendingApprovalId: { type: string, nullable: true }
        service: { $ref: "#/components/schemas/IncidentService" }
        host: { $ref: "#/components/schemas/IncidentHost" }

    IncidentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
        total: { type: integer }

    IncidentDetail:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          properties:
            events:
              type: array
              items: { $ref: "#/components/schemas/IncidentEvent" }
            approvals:
              type: array
              items: { $ref: "#/components/schemas/Approval" }
            actions:
              type: array
              items: { $ref: "#/components/schemas/Action" }
            analysis:
              allOf:
                - $ref: "#/components/schemas/AiAnalysis"
              nullable: true
            report:
              allOf:
                - $ref: "#/components/schemas/Report"
              nullable: true

    IncidentEvent:
      type: object
      required: [id, ts, type]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        type: { type: string }
        payload:
          type: object
          additionalProperties: true
          nullable: true

    IncidentAction:
      type: object
      properties:
        note: { type: string }

    ApprovalIncident:
      type: object
      nullable: true
      properties:
        id: { type: string }
        serviceId: { type: string }
        title: { type: string }
        severity: { type: string, enum: [info, warning, error, critical] }
        status: { type: string }
        summary: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }

    ApprovalService:
      type: object
      nullable: true
      properties:
        id: { type: string }
        hostId: { type: string }
        name: { type: string }
        status: { type: string }
        autoRestartPhase: { type: string, enum: [observe, approve, auto] }

    ApprovalHost:
      type: object
      nullable: true
      properties:
        id: { type: string }
        kind: { type: string, enum: [windows, wsl] }
        name: { type: string }
        distro: { type: string, nullable: true }

    Approval:
      type: object
      required: [id, incidentId, status, requestedAt]
      properties:
        id: { type: string }
        incidentId: { type: string }
        requestedAction: { type: object, additionalProperties: true }
        requestedBy:
          {
            type: string,
            nullable: true,
            description: "承認要求の作成者。監視エンジン由来は null",
          }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        requestedAt: { type: string, format: date-time }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        incident: { $ref: "#/components/schemas/ApprovalIncident" }
        service: { $ref: "#/components/schemas/ApprovalService" }
        host: { $ref: "#/components/schemas/ApprovalHost" }

    ApprovalList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Approval" }
        total: { type: integer }

    ApprovalDecision:
      type: object
      properties:
        note: { type: string }

    ApprovalDecisionResult:
      type: object
      properties:
        approval: { $ref: "#/components/schemas/Approval" }
        action:
          allOf:
            - $ref: "#/components/schemas/Action"
          nullable: true
        incident:
          type: object
          properties:
            id: { type: string }
            status: { type: string }

    DeployRequest:
      type: object
      required:
        [id, serviceId, requestedBy, status, requestedAt, expiresAt, snapshot]
      properties:
        id: { type: string }
        serviceId: { type: string }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, approved, rejected, expired, executed, failed]
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        actionId: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        snapshot: { $ref: "#/components/schemas/DeployRequestSnapshot" }
        service:
          allOf:
            - $ref: "#/components/schemas/DeployRequestService"
          nullable: true

    DeployRequestList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeployRequest" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    DeployRequestSnapshot:
      type: object
      required:
        [
          command,
          timeoutSec,
          restartAfter,
          healthTimeoutSec,
          envHash,
          deployEnvHash,
        ]
      properties:
        command:
          type: array
          items: { type: string }
          minItems: 1
        cwd: { type: string, nullable: true }
        timeoutSec: { type: integer }
        restartAfter: { type: boolean }
        healthTimeoutSec: { type: integer }
        envHash:
          {
            type: string,
            description: "サービス env の SHA-256 ハッシュ。平文値は保存しない",
          }
        deployEnvHash:
          {
            type: string,
            description: "deploy.env の SHA-256 ハッシュ。平文値は保存しない",
          }

    DeployRequestService:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    DeployRequestDecision:
      type: object
      properties:
        note: { type: string, maxLength: 500 }

    DeployRequestDecisionResult:
      type: object
      required: [request, action]
      properties:
        request: { $ref: "#/components/schemas/DeployRequest" }
        action:
          type: object
          required: [id, status]
          properties:
            id: { type: string }
            status:
              { type: string, enum: [pending, running, succeeded, failed] }

    Action:
      type: object
      required: [id, type, status]
      properties:
        id: { type: string }
        incidentId: { type: string, nullable: true }
        serviceId: { type: string }
        type: { type: string, enum: [start, stop, restart, kill, deploy] }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        requestedBy: { type: string, nullable: true }
        approvedBy: { type: string, nullable: true }
        policyId: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }

    ActionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Action" }
        nextCursor: { type: string, nullable: true }

    AiAnalysisQueued:
      type: object
      required: [incidentId, queued, alreadyQueued, status]
      properties:
        incidentId: { type: string }
        queued: { type: boolean }
        alreadyQueued: { type: boolean }
        status: { type: string, enum: [queued] }

    AiAnalysis:
      type: object
      required: [id, incidentId, provider, model, result, createdAt]
      properties:
        id: { type: string }
        incidentId: { type: string }
        provider: { type: string }
        model: { type: string }
        promptVersion: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        result:
          type: object
          required: [severity, category, summary, confidence]
          properties:
            severity: { type: string, enum: [info, warning, error, critical] }
            category: { type: string }
            summary: { type: string }
            rootCauseHypothesis: { type: string }
            evidence:
              type: array
              items:
                type: object
                properties:
                  logId: { type: string }
                  quote: { type: string }
            recommendedActions:
              type: array
              items:
                type: object
                additionalProperties: true
            confidence: { type: number, minimum: 0, maximum: 1 }
            needsHuman: { type: boolean }
        confidence: { type: number }
        latencyMs: { type: integer }
        createdAt: { type: string, format: date-time }

    Report:
      type: object
      required: [id, incidentId, format, body, createdAt]
      properties:
        id: { type: string }
        incidentId: { type: string }
        format: { type: string, enum: [markdown, json] }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    ReportIncident:
      type: object
      nullable: true
      properties:
        id: { type: string }
        title: { type: string }
        severity: { type: string, enum: [info, warning, error, critical] }
        status: { type: string }
        startedAt: { type: string, format: date-time }
        serviceId: { type: string }
        serviceName: { type: string, nullable: true }

    ReportListItem:
      allOf:
        - $ref: "#/components/schemas/Report"
        - type: object
          properties:
            incident: { $ref: "#/components/schemas/ReportIncident" }

    ReportList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReportListItem" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    ReportDetail:
      allOf:
        - $ref: "#/components/schemas/Report"
        - type: object
          properties:
            incident: { $ref: "#/components/schemas/ReportIncident" }
            analysis:
              allOf:
                - $ref: "#/components/schemas/AiAnalysis"
              nullable: true

    Policy:
      type: object
      required: [id, name, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        scope:
          type: object
          additionalProperties: true
        rules:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        priority: { type: integer }

    MailSettingsInput:
      type: object
      required: [host, port, from, secure, recipients]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535, default: 587 }
        secure: { type: boolean, default: false }
        username: { type: string }
        password:
          {
            type: string,
            description: "書き込み時のみ。省略時は保存済みパスワードを維持",
          }
        clearPassword:
          { type: boolean, description: "保存済みパスワードを削除する" }
        from: { type: string, format: email }
        recipients:
          type: array
          items: { type: string, format: email }
          minItems: 1
        mode: { type: string, enum: [immediate, digest5m], default: immediate }

    MailSettingsView:
      type: object
      required: [configured, source, host, port, from, secure, recipients]
      properties:
        configured: { type: boolean }
        source: { type: string, enum: [db, env, none] }
        host: { type: string }
        port: { type: integer }
        secure: { type: boolean }
        username: { type: string }
        from: { type: string }
        recipients:
          type: array
          items: { type: string, format: email }
        mode: { type: string, enum: [immediate, digest5m] }
        passwordSet: { type: boolean }

    MailTestResult:
      type: object
      required: [accepted, recipients]
      properties:
        accepted:
          type: array
          items: { type: string, format: email }
        recipients:
          type: array
          items: { type: string, format: email }

    AiSettingsInput:
      type: object
      required: [baseUrl, model]
      properties:
        baseUrl: { type: string, format: uri }
        model: { type: string }
        apiKey:
          {
            type: string,
            description: "書き込み時のみ。省略時は保存済み API キーを維持",
          }
        clearApiKey:
          { type: boolean, description: "保存済み API キーを削除する" }
        maxInputTokens: { type: integer, minimum: 256, default: 8000 }
        temperature: { type: number, minimum: 0, maximum: 2, default: 0.2 }
        timeoutSec: { type: integer, minimum: 5, default: 60 }
        dailyRequestLimit: { type: integer, minimum: 0, default: 200 }
        sendLogsExternally: { type: boolean, default: false }

    AiSettingsView:
      type: object
      required:
        [
          configured,
          source,
          provider,
          baseUrl,
          model,
          apiKeySet,
          maxInputTokens,
          temperature,
          timeoutSec,
          dailyRequestLimit,
          dailyUsed,
          sendLogsExternally,
          localEndpoint,
          externalLogsAllowed,
        ]
      properties:
        configured: { type: boolean }
        source: { type: string, enum: [db, env, none] }
        provider: { type: string, enum: [openai-compatible] }
        baseUrl: { type: string, format: uri }
        model: { type: string }
        apiKeySet: { type: boolean }
        maxInputTokens: { type: integer }
        temperature: { type: number }
        timeoutSec: { type: integer }
        dailyRequestLimit: { type: integer }
        dailyUsed: { type: integer }
        sendLogsExternally: { type: boolean }
        localEndpoint:
          { type: boolean, description: "localhost / private IP など" }
        externalLogsAllowed:
          { type: boolean, description: "ローカル、または外部送信が許可済み" }

    AiTestResult:
      type: object
      required: [models, latencyMs, baseUrl, model]
      properties:
        models:
          type: array
          items: { type: string }
        latencyMs: { type: integer }
        baseUrl: { type: string, format: uri }
        model: { type: string }

    RetentionSettingsInput:
      type: object
      required: [logDays]
      properties:
        logDays: { type: integer, minimum: 1, maximum: 3650, default: 14 }

    RetentionSettings:
      type: object
      required: [logDays, source, updatedAt]
      properties:
        logDays: { type: integer }
        source: { type: string, enum: [db, env] }
        updatedAt: { type: string, format: date-time, nullable: true }

    BackupResult:
      type: object
      required: [path, sizeBytes, createdAt]
      properties:
        path: { type: string }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }

    AuditLog:
      type: object
      required: [id, action, target, ts]
      properties:
        id: { type: string }
        actorUserId: { type: string, nullable: true }
        actorLabel: { type: string }
        action: { type: string }
        target: { type: string }
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
        reason: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        ts: { type: string, format: date-time }

    AuditLogList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditLog" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
