name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: CLI schema is up to date
        run: |
          pnpm schema:generate
          git diff --exit-code -- docs/cli-schema.json

      - name: Build CLI
        run: pnpm --filter sys4sys build

      - name: Verify package contents and installed binary
        run: node scripts/verify-cli-package.mjs

      - name: Publish to npm
        working-directory: apps/cli
        run: npm publish --access public

      - name: Prepare release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v tag="${GITHUB_REF_NAME}" '
              BEGIN { printing = 0 }
              /^## / { printing = (index($0, "## " tag " ") == 1) }
              printing { print }
            ' CHANGELOG.md > release-notes.md
          else
            : > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
          fi
